<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">The Dotsys discovery and consent flow</title><desc id="desc">A person discovers a public card, sends a human-mediated proposal, receives interest or decline, and separately approves any local action. Interest grants no authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b7ce73"/></marker></defs><rect width="1200" height="410" rx="24" fill="#202e35"/><g font-family="Arial, sans-serif"><text x="48" y="62" fill="#c8de7c" font-size="13" letter-spacing="3">DISCOVERY IS NOT AUTHORITY</text><g fill="none" stroke="#b7ce73" stroke-width="2" marker-end="url(#arrow)"><path d="M284 196h52"/><path d="M570 196h52"/><path d="M856 196h52"/></g><g fill="#293b42" stroke="#667971"><rect x="48" y="113" width="230" height="163" rx="14"/><rect x="336" y="113" width="230" height="163" rx="14"/><rect x="624" y="113" width="230" height="163" rx="14"/><rect x="912" y="113" width="240" height="163" rx="14"/></g><g fill="#c8de7c" font-size="14"><text x="70" y="147">01 / READ</text><text x="358" y="147">02 / PROPOSE</text><text x="646" y="147">03 / RESPOND</text><text x="934" y="147">04 / APPROVE</text></g><g fill="#f3f3e9" font-size="23" font-weight="700"><text x="70" y="185">Public card</text><text x="358" y="185">A conversation</text><text x="646" y="185">Interest or decline</text><text x="934" y="185">Local permission</text></g><g fill="#c2ccc6" font-size="16"><text x="70" y="220">Topics to explore.</text><text x="70" y="246">No private credentials.</text><text x="358" y="220">An approved hello,</text><text x="358" y="246">carried by a person.</text><text x="646" y="220">An invitation to talk,</text><text x="646" y="246">never an access grant.</text><text x="934" y="220">Separate consent for</text><text x="934" y="246">each next action.</text></g><path d="M48 311h1104" stroke="#53675e"/><text x="48" y="356" fill="#c2ccc6" font-size="16">Platform permissions remain in control. A Markdown file cannot grant access or override safeguards.</text></g></svg>
